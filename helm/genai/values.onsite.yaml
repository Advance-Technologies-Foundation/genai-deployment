replicaCount: 1

dockerRegistry:
  enabled: true
  username: <your-username>
  password: <your-password>
  email: <your-email>

commonImagesConfig:
  imagePullSecretEnabled: true

enrichment:
  resources:
    limits:
      cpu: 600m
      memory: 1600Mi
    requests:
      cpu: 200m
      memory: 1000Mi

env:
  - name: ENRICHMENT_AuthenticationOptions__UseOAuth
    value: "false"
  - name: ENRICHMENT_AuthenticationOptions__IdentityProviderUrl
    value: "http://localhost"
  - name: ENRICHMENT_AuthenticationOptions__ClientId
    value: "onsite-client"

appConfig:
  db:
    host: postgresql-enrichment
    port: 5432
    user: postgres
    password: "postgres-password"
    database: enrichment
    schema: enrichment
  genAI:
    llmProviders:
      defaultModel: gpt-5.2
      embeddingsModel: text-embedding-3-large
      models:
        openai:
          gpt-5.2:
            model: gpt-5.2
            api_key: "<openai_api_key>"
          text-embedding-3-large:
            model: text-embedding-3-large
            api_key: "<openai_api_key>"
        azure: {}
#          azure-gpt-5.2:
#            model: <your-model-name>
#            resource_name: <your-azure-resource-name>
#            api_key: <your-azure-api-key>
#          azure-text-embedding-3-large:
#            model: text-embedding-3-large
#            resource_name: <your-azure-resource-name>
#            api_key: <your-azure-api_key>

    maxRequestsPerHour: -1
    maxRequestsPerDay: -1
    maxRequestsPerMonth: -1
    maxTokensPerMonth: -1
    maxTokensPerDay: -1
    maxTokensPerHour: -1
    maxTokensPerMinute: -1
    maxTotalTokens: 0
    storeSensitiveFieldsInStats: false
  traceDebugInfo: false
  logLevel: "ERROR"
  minThreads: 1000
  redis:
    enabled: true
    host: "enrichment-redis-master:6379,password=redis-password,defaultDatabase=10,abortConnect=false"

redis:
  auth:
    enabled: true
    password: "redis-password"
  # volumePermissions disabled: os-shell image is not available in internal registries.
  volumePermissions:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""  # Use default storage class

subscriptionTracking:
  limitsSourceMode: local

usageLimitsRetriever:
  env:
    totalTokensLimitId: AAE5F33A-C7AB-4099-A9F7-FB03CC89C271
    totalActionsLimitId: 88c9245f-349e-4d01-8a35-ae3a09028503

service:
  type: NodePort
  nodePort: 30082

ingress:
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: "/"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: '480'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '480'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '480'
  hosts:
    - enrichment.example.com

spacy:
  service:
    type: ClusterIP
    port: 5000
  resources:
    limits:
      cpu: 1500m
      memory: 2000Mi
    requests:
      cpu: 800m
      memory: 1000Mi

postgresql:
  fullnameOverride: postgresql-enrichment
  postgresqlDataDir: /opt/bitnami/postgresql/data
  # volumePermissions disabled: os-shell image is not available in internal registries.
  volumePermissions:
    enabled: false
  primary:
    extraEnvVars: []
    containerSecurityContext:
      enabled: true
      runAsUser: 1001
      runAsGroup: 1001
      runAsNonRoot: true
      readOnlyRootFilesystem: false
    resources:
      requests:
        memory: 128Mi
        cpu: 200m
      limits:
        memory: 1024Mi
        cpu: 500m
    persistence:
      enabled: true
      size: 8Gi
      mountPath: /opt/bitnami/postgresql
  auth:
    username: postgres
    password: "postgres-password"
    database: enrichment
    forcePassword: true

litellm:
  resources:
    limits:
      memory: 3096Mi
      cpu: 1000m
